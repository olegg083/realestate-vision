name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Тестам API не нужны torch и faiss: поисковый движок подменяется фейковым
      - name: Install dependencies
        run: pip install -c requirements.txt ruff pytest httpx fastapi python-multipart Pillow

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v
